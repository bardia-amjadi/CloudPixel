<!DOCTYPE html>
<html lang="fa" dir="rtl">
   <head>
      <meta charset="UTF-8">
      <meta name="viewport" content="width=device-width, initial-scale=1.0">
      <title>CloudPixel | زیرساخت شبکه ابری</title>
      <link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
      <style>
         :root {
         --background: #06070a;
         --surface: #0d1117;
         --border: #1f2937;
         --text: #f8fafc;
         --muted: #9ca3af;
         --primary: #8b5cf6;
         --primary-light: #a78bfa;
         }
         * {
         margin:0;
         padding:0;
         box-sizing:border-box;
         }
         body {
         font-family:"Vazirmatn", sans-serif;
         background:var(--background);
         color:var(--text);
         min-height:100vh;
         overflow:hidden;
         }
         /* Header */
         header {
         height:84px;
         display:flex;
         align-items:center;
         justify-content:space-between;
         padding:0 9%;
         border-bottom:1px solid var(--border);
         position:relative;
         z-index:5;
         }
         .logo {
         font-size:30px;
         font-weight:800;
         letter-spacing:-1px;
         color:white;
         }
         .logo span {
         color:var(--primary-light);
         }
         .header-label {
         font-size:14px;
         color:var(--muted);
         }
         /* Background Grid */
         .grid {
         position:absolute;
         inset:84px 0 0;
         background-image:
         linear-gradient(
         rgba(167,139,250,.045) 1px,
         transparent 1px
         ),
         linear-gradient(
         90deg,
         rgba(167,139,250,.045) 1px,
         transparent 1px
         );
         background-size:80px 80px;
         mask-image:
         radial-gradient(
         circle at center,
         black,
         transparent 75%
         );
         }
         /* Main */
         main {
         min-height:calc(100vh - 84px);
         display:flex;
         justify-content:center;
         align-items:center;
         position:relative;
         padding:40px;
         }
         .container {
         text-align:center;
         max-width:900px;
         }
         /* Title */
         h1 {
         font-size:
         clamp(42px,6vw,72px);
         font-weight:800;
         line-height:1.35;
         letter-spacing:-2px;
         }
         h1 span {
         color:var(--primary-light);
         }
         /* Subtitle */
         .subtitle {
         margin-top:32px;
         font-size:24px;
         font-weight:500;
         color:#e5e7eb;
         }
         /* Description */
         .description {
         margin:25px auto;
         max-width:720px;
         font-size:17px;
         line-height:2;
         color:var(--muted);
         }
         /* Status */
         .status {
         display:inline-flex;
         align-items:center;
         gap:10px;
         margin-top:30px;
         padding:12px 26px;
         background:
         rgba(139,92,246,.08);
         border:
         1px solid rgba(167,139,250,.25);
         border-radius:8px;
         color:#ddd6fe;
         font-size:15px;
         }
         .dot {
         width:8px;
         height:8px;
         border-radius:50%;
         background:var(--primary-light);
         }
         /* Button */
         .action {
         margin-top:40px;
         }
         button {
         font-family:inherit;
         background:var(--primary);
         color:white;
         border:none;
         border-radius:7px;
         padding:15px 38px;
         font-size:16px;
         font-weight:600;
         cursor:pointer;
         transition:.2s;
         }
         button:hover {
         background:#7c3aed;
         }
         /* Footer */
         footer {
         position:absolute;
         bottom:25px;
         width:100%;
         text-align:center;
         color:#64748b;
         font-size:13px;
         }
      </style>
   </head>
   <body>
      <header>
         <div class="logo">
            Cloud<span>Pixel</span>
         </div>
         <div class="header-label">
            پلتفرم زیرساخت شبکه ابری
         </div>
      </header>
      <div class="grid"></div>
      <main>
         <div class="container">
            <h1>
               نسل جدید
               <br>
               <span>
               اتصال امن شبکه‌ها
               </span>
            </h1>
            <div class="subtitle">
               Tunnel • DNS • Edge Infrastructure
            </div>
            <div class="description">
               CloudPixel یک پلتفرم زیرساختی مدرن برای
               ایجاد تونل‌های امن، مدیریت DNS و اتصال
               سرویس‌ها و شبکه‌های خصوصی در هر نقطه ایران است.
            </div>
            <div class="status">
               <div class="dot"></div>
               در حال توسعه — به زودی
            </div>

         </div>
      </main>
      <footer>
         © 2026 CloudPixel — تمامی حقوق محفوظ است
      </footer>
   </body>
</html>
